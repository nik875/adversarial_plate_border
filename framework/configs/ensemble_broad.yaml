# ===========================================================================
# Ensemble Adversarial Training — Broad 8-Model Production Config
# ===========================================================================
#
# Covers 5 architecture families × 4 vision tasks:
#   CNNs:          ResNet-50, ConvNeXt-Small, YOLOv8s
#   Hierarchical:  Swin-T
#   Self-supervised ViT: DINOv2-ViT-B/14
#   Vision-Language: CLIP ViT-L/14, SmolVLM-500M
#   OCR encoder:   TrOCR-base-printed
#
# Usage:
#   python framework/scripts/train_ensemble.py framework/configs/ensemble_broad.yaml
#
# Smoke test (CPU, no real data, 2 steps):
#   python framework/scripts/train_ensemble.py framework/configs/ensemble_broad.yaml \
#       --epochs 1 --max-steps 2 --device cpu
# ===========================================================================

compute_device: cuda

# Manifest CSV generated by framework/scripts/download/generate_manifest.py
# Provides pre-scanned paths for every dataset with correct train/val split.
# If the file is missing, config_loader falls back to root-based glob loading.
manifest: ~/.cache/adversarial_plate_manifest.csv

# ---------------------------------------------------------------------------
# Attack strategies — any strategy can be used against any model
# ---------------------------------------------------------------------------
strategies:
  - name: border
    type: border
    strategy_id: 0

  - name: sticker
    type: sticker
    strategy_id: 1

  - name: perturbation
    type: perturbation
    strategy_id: 2

# ---------------------------------------------------------------------------
# Model pool — 8 models spanning 4 vision tasks
# ---------------------------------------------------------------------------
models:
  - name: resnet50
    architecture: resnet50
    domain_type: classification

  - name: convnext_small
    architecture: convnext_small
    domain_type: classification

  - name: swin_t
    architecture: swin_t
    domain_type: classification

  - name: dinov2_vitb14
    architecture: dinov2_vitb14
    domain_type: features

  - name: clip_vit_l14
    architecture: clip_vit_l14
    domain_type: features

  - name: yolov8s
    architecture: yolov8s
    domain_type: detection

  - name: trocr_base
    architecture: trocr_base
    domain_type: ocr

  - name: smolvlm_500m
    architecture: smolvlm_500m
    domain_type: vlm

# ---------------------------------------------------------------------------
# Dataset pool
# Run framework/scripts/download/download_all.sh to populate these paths.
# ---------------------------------------------------------------------------
datasets:
  # --- Labeled val splits (split: val) — never seen during training ----------
  - name: imagenet_val
    split: val
    domain_type: natural                  # 50k images, class 0–999

  - name: coco_val
    split: val
    domain_type: natural                  # 5k images, COCO category labels

  # --- Train splits (split: train) -------------------------------------------
  - name: imagenet_train
    split: train
    domain_type: natural                  # 1.28M images at 640px

  - name: imagenet_test
    split: train
    domain_type: natural                  # ~100k images, no labels

  - name: coco_train
    split: train
    domain_type: natural                  # ~118k images

  - name: textvqa
    split: train
    domain_type: text_in_scene            # ~34k text-in-scene images

  - name: cc3m
    split: train
    domain_type: web_natural              # ~1.2M images at 640px

  - name: openimages
    split: train
    domain_type: detection                # ~1M images at 640px

  # --- Synthetic (no manifest entry — always uses root glob) ------------------
  - name: synthetic
    root: /tmp/synthetic_images
    synthetic: true
    max_samples: 50
    domain_type: generic

# ---------------------------------------------------------------------------
# Priors (character-texture decoders) — empty for broad generic training
# ---------------------------------------------------------------------------
priors: []

# ---------------------------------------------------------------------------
# TaskEncoder
# ---------------------------------------------------------------------------
task_encoder:
  hidden_dim: 64
  num_layers: 2
  alpha: 0.5

# ---------------------------------------------------------------------------
# Generator (multi-TAESD architecture)
# ---------------------------------------------------------------------------
generator:
  latent_dim: 16
  patch_height: 512
  patch_width: 512
  num_taesd: 6
  transformer_d_model: 128
  transformer_nhead: 4
  transformer_d_ff: 512
  transformer_enc_layers: 1
  transformer_dec_layers: 1

# ---------------------------------------------------------------------------
# EnsembleTrainer
# ---------------------------------------------------------------------------
trainer:
  max_steps: 1100
  patches_per_image: 8
  images_per_batch: 32
  k_neurons: 10000
  learning_rate: 3.5e-5
  taesd_lr_ratio: 0.1
  lr_min: 1.0e-6
  diversity_weight: 1.0
  quality_weight: 8.0
  tv_weight: 2.5
  spectrum_weight: 2.0
  output_dir: runs/broad_ensemble
  save_every_epochs: 1
